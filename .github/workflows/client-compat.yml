name: Client compatibility (migas-py)

on:
  push:
    branches:
    - main
  pull_request: {}
  schedule:
  # Catch migas-py main drifting from the server between server changes
  - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ['0.3.0', '0.4.0', main]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0
    - name: Run compat check for migas-py@${{ matrix.ref }}
      run: ./scripts/test_client_compat.sh "${{ matrix.ref }}"
    - name: Server logs
      if: always()
      run: docker compose logs migas-server
    - name: Stop all the things
      if: always()
      run: docker compose down
